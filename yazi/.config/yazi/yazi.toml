# Anything apart from this follows from the default configuration
[mgr]
ratio = [1, 3, 4]
sort_by = "alphabetical"
sort_dir_first = true
linemode = "none"
show_hidden = true
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll", "touch", "move", "drag"]

[preview]
wrap = "yes"
tab_size = 2
max_width = 1200
max_height = 1800

[opener]
edit = [
    # yazi >= 26.x: %s = all selected paths, %s1 = the first (already quoted: no "..." around them).
    # The old "$@" / "$1" are silently passed as nothing -> $EDITOR opens with no file.
    { run = '${EDITOR:-vi} %s', desc = "$EDITOR", block = true, for = "unix" },
    { run = 'code %s', desc = "VS Code", block = false, for = "unix" },
    { run = 'code %s', orphan = true, desc = "code", for = "windows" },
    { run = 'code -w %s', block = true, desc = "code (block)", for = "windows" },
]
open = [
    { run = 'xdg-open %s1', desc = "Open", for = "linux" },
    { run = 'code %s', desc = "VS Code", for = "linux" },
    { run = 'open %s', desc = "Open", for = "macos" },
    { run = 'start "" %s1', orphan = true, desc = "Open", for = "windows" },
]
[plugin]

prepend_previewers = [
    { mime = "application/*zip", run = "ouch" },
    { mime = "application/x-tar", run = "ouch" },
    { mime = "application/x-bzip2", run = "ouch" },
    { mime = "application/x-7z-compressed", run = "ouch" },
    { mime = "application/x-rar", run = "ouch" },
    { mime = "application/x-xz", run = "ouch" },
    { url = "*.md", run  = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'},
    { url = "*.{pdb,pqr}", run = "code" },
    { mime = "audio/*", run = "exifaudio" },
    { mime = "application/x-bittorrent", run = "torrent-preview" },
    { url = "*.ipynb", run = 'piper -- rich -j --left --panel=rounded --guides --line-numbers --force-terminal "$1"'},
    { url = "*.json", run = 'piper -- rich -j --left --panel=rounded --guides --line-numbers --force-terminal "$1"'},
    # { name = "*.json", run = "rich-preview"},
    { url = "*.rst", run = 'piper -- rich -j --left --panel=rounded --guides --line-numbers --force-terminal "$1"'},
    { url = "*.csv", run = 'piper -- rich -j --left --panel=rounded --guides --line-numbers --force-terminal "$1"'},
]
