## Plugin keymaps
[[mgr.prepend_keymap]]
on   = "!"
run  = 'shell "$SHELL" --block'
desc = "Open shell here"

[[mgr.prepend_keymap]]
on = ["<F5>"]
run = "refresh"
desc = "Refresh the current directory"

[[mgr.prepend_keymap]]
on  = "q"
run = "plugin confirm-quit"

[[mgr.prepend_keymap]]
on = ["A"]
run = "create --dir"
desc = "Create a directory"

[[mgr.prepend_keymap]]
on = "<C-k>"
run = "seek -5"
desc = "Seek up 5 units in the preview"
[[mgr.prepend_keymap]]
on = "<C-j>"
run = "seek 5"
desc = "Seek down 5 units in the preview"
# Max Preview
[[mgr.prepend_keymap]]
on   = "B"
run  = "plugin toggle-pane min-preview"
desc = "Show or hide the preview pane"

# Hide Preview
[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.prepend_keymap]]
on  = [ "K" ]
run = "plugin parent-arrow -1"

[[mgr.prepend_keymap]]
on  = [ "J" ]
run = "plugin parent-arrow 1"

[[mgr.prepend_keymap]]
on   = [ "<C-p>" ]
run  = "plugin smart-paste"
desc = "Paste into the hovered directory or CWD"

[[mgr.prepend_keymap]]
on = ["u", "g"]
run = "plugin whoosh jump_by_key"
desc = "Jump bookmark by key"

# Direct fuzzy search access
[[mgr.prepend_keymap]]
on = "U"
run = "plugin whoosh fuzzy"
desc = "Direct fuzzy search for bookmarks"

# Basic bookmark operations
[[mgr.prepend_keymap]]
on = [ "u", "a" ]
run = "plugin whoosh save"
desc = "Add bookmark (hovered file/directory)"

[[mgr.prepend_keymap]]
on = [ "u", "A" ]
run = "plugin whoosh save_cwd"
desc = "Add bookmark (current directory)"

# Temporary bookmarks
[[mgr.prepend_keymap]]
on = [ "u", "t" ]
run = "plugin whoosh save_temp"
desc = "Add temporary bookmark (hovered file/directory)"

[[mgr.prepend_keymap]]
on = [ "u", "T" ]
run = "plugin whoosh save_cwd_temp"
desc = "Add temporary bookmark (current directory)"

# Jump to bookmarks
[[mgr.prepend_keymap]]
on = [ "u", "f" ]
run = "plugin whoosh jump_by_fzf"
desc = "Jump bookmark by fzf"

# Delete bookmarks
[[mgr.prepend_keymap]]
on = [ "u", "d" ]
run = "plugin whoosh delete_by_key"
desc = "Delete bookmark by key"

[[mgr.prepend_keymap]]
on = [ "u", "D" ]
run = "plugin whoosh delete_by_fzf"
desc = "Delete bookmarks by fzf (use TAB to select multiple)"

[[mgr.prepend_keymap]]
on = [ "u", "C" ]
run = "plugin whoosh delete_all"
desc = "Delete all user bookmarks"

# Rename bookmarks
[[mgr.prepend_keymap]]
on = [ "u", "r" ]
run = "plugin whoosh rename_by_key"
desc = "Rename bookmark by key"

[[mgr.prepend_keymap]]
on = [ "u", "R" ]
run = "plugin whoosh rename_by_fzf"
desc = "Rename bookmark by fzf"

[[mgr.prepend_keymap]]
on = ["f", "g"]
run = "plugin fr rg"
desc = "Search file by content (rg)"

[[mgr.prepend_keymap]]
on   = [ "f", "s" ]
run  = "plugin smart-filter"
desc = "Smart filter"
[[mgr.prepend_keymap]]
on   = [ "f", "c" ]
run  = "plugin jump-to-char"
desc = "Jump to char"

## diff.yazi
[[mgr.prepend_keymap]]
on   = [ "<C-d>" ]
run  = "plugin diff"
desc = "Diff the selected with the hovered file"

[[mgr.prepend_keymap]]
on = [ "l" ]
run = "plugin bypass smart_enter"
desc = "Recursively enter child directory, skipping children with only a single subdirectory"
[[mgr.prepend_keymap]]
on = [ "H" ]
run = "plugin bypass reverse"
desc = "Recursively enter parent directory, skipping parents with only a single subdirectory"

#[[manager.prepend_keymap]]
#on = [ "m" ]
#run = "plugin relative-motions"
#desc = "Trigger a new relative motion"


## Drag and Drop functionality using Finder
[[mgr.prepend_keymap]]
on  = [ "<C-n>" ]
run = '''
	shell 'open -R "$1"' --confirm
'''
desc = "Open file in Finder to drag and drop"
## Testing plugin for understanding
[[mgr.prepend_keymap]]
on  = [ "e", "e" ]
run = ["select --state=none", "rename --hovered --force --cursor=before_ext", "select --state=none"]
desc  = "Test plugin"
[[mgr.prepend_keymap]]
on  = [ "'", "l"]
run = 'plugin custom-shell -- custom zsh "lazygit"'
[[mgr.prepend_keymap]]
on  = [ "'", ";" ]
run = 'plugin custom-shell -- custom zsh "echo hi" --orphan'
[[mgr.prepend_keymap]]
on  = [ "'", "h" ]
run = 'plugin custom-shell history'
[[mgr.prepend_keymap]]
on  = [ "'", "t" ]
run = 'plugin custom-shell -- auto --interactive'
## Mactagging
[[mgr.prepend_keymap]]
on   = [ "b", "a" ]
run  = 'plugin mactag --args="add"'
desc = "Tag selected files"

[[mgr.prepend_keymap]]
on   = [ "b", "r" ]
run  = 'plugin mactag --args="remove"'
desc = "Untag selected files"
[[mgr.prepend_keymap]]
on = ["b", "a"]
run = "plugin mactags --args=add"
desc = "Add tagging colors to a file/folder"
[[mgr.prepend_keymap]]
on = ["b", "x"]
run = "plugin mactags --args=remove"
desc = "removes input tags from all tags to a file/folder"
[[mgr.prepend_keymap]]
on = ["b", "d"]
run = "plugin mactags --args=remove_all"
desc = "removed all the tags attached to the file/folder"
[[mgr.prepend_keymap]]
on = ["b", "s"]
run = "plugin mactags --args=set"
desc = "completely replace existing tags with new ones"
[[mgr.prepend_keymap]]
on = ["b", "f"]
run = "plugin mactags --args=find_all"
desc = "find all files with set color"
[[mgr.prepend_keymap]]
on = ["b", "o"]
run = "plugin mactags --args=display"
desc = "find all files with set color"

[[mgr.prepend_keymap]]
on = ["c", "a"]
run = "plugin ouch zip"
desc = "Compress with ouch"

[[mgr.prepend_keymap]]
on   = [ "i" ]
run = "plugin easyjump"
desc = "easyjump"

[[mgr.prepend_keymap]]
on = [ "<C-v>" ]
run = '''
  shell --confirm 'qlmanage -p "$@"'
'''
desc = "Preview"
for = "macos"
[[mgr.prepend_keymap]]
on = "<C-1>"
run = ["plugin copy-file-contents"]
desc = "Copy contents of file"

[[mgr.prepend_keymap]]
on = [ "g", "r" ]
run = '''
	shell 'ya pub dds-cd --str "$(git rev-parse --show-toplevel)"' --confirm
'''

[[mgr.prepend_keymap]]
on = "<C-p>"
run = '''
  shell 'qlmanage -p "$@"' --confirm
'''

[[mgr.prepend_keymap]]
on = [ "g", "b"]
run = '''
    shell 'gh browse .'
'''
desc = "Browse repo on github"
[[mgr.prepend_keymap]]
on = [ "g", "f"]
run = '''
    shell 'gh browse $(git ls-files $0) --branch=$(git branch --show-current)'
'''
desc = "Browse file on github"

[[mgr.prepend_keymap]]
on   = [ "g", "v" ]
run  = "plugin vcs-files"
desc = "Show Git file changes"

[[mgr.prepend_keymap]]
on   = "+"
run  = "plugin zoom 1"
desc = "Zoom in hovered file"

[[mgr.prepend_keymap]]
on   = "-"
run  = "plugin zoom -1"
desc = "Zoom out hovered file"

# Copy yanked files to the system clipboard
[[mgr.prepend_keymap]]
on  = "<C-y>"
run = [ "yank", 'plugin clipboard -- --action=copy' ]

# Paste files from the system clipboard into the current directory
[[mgr.prepend_keymap]]
on  = "<C-p>"
run = [ 'plugin clipboard -- --action=paste' ]
