# Publishes https://anirudhg07.github.io/dotfiles/ :
#   /            site/index.html   (the terminal-style landing page)
#   /setup.sh    setup.sh          (curl -fsSL https://anirudhg07.github.io/dotfiles/setup.sh -o setup.sh)
# setup.sh is copied from the repo root on every push, so the URL never drifts from the script.
name: pages

on:
  push:
    branches: [main, stow]
    paths: [setup.sh, site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check and assemble the site
        run: |
          bash -n setup.sh
          mkdir _site
          cp site/index.html _site/index.html
          cp setup.sh _site/setup.sh
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
